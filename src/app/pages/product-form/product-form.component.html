<section class="page">
  <header>
    <h1>{{ isEdit ? 'Editar produto' : 'Novo produto' }}</h1>
    <a routerLink="/app/products">Voltar</a>
  </header>

  @if (loadingProduct()) {
    <p>Carregando produto...</p>
  } @else {
    <form (ngSubmit)="submit()">
      <label>
        Imagem (URL)
        <input type="url" name="imageUrl" [(ngModel)]="imageUrl" required />
      </label>
      <label>
        Título
        <input type="text" name="title" [(ngModel)]="title" required minlength="2" />
      </label>
      <label>
        Descrição
        <textarea name="description" [(ngModel)]="description" required minlength="2" rows="5"></textarea>
      </label>
      <label>
        Preço (R$)
        <input type="number" name="price" [(ngModel)]="price" required min="0.01" step="0.01" />
      </label>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="saving()">
        {{ saving() ? 'Salvando...' : 'Salvar' }}
      </button>
    </form>
  }
</section>
