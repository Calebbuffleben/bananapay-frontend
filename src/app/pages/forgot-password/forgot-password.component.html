<section class="auth-screen">
  <div class="auth-stage">
    <div class="brand-plane" aria-label="banana pay">
      <p class="brand-mark">
        <span class="banana">banana</span><span class="pay">pay</span>
        <small>Recuperação</small>
      </p>
      <h1>Volte a vender em minutos.</h1>
      <p class="lede">Enviamos um link seguro para redefinir sua senha.</p>
    </div>

    <div class="auth-panel">
      <h2>Esqueci a senha</h2>
      <p class="muted">Informe seu e-mail para receber o link</p>

      <form (ngSubmit)="submit()">
        <label class="field">
          E-mail
          <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
        </label>

        @if (message()) {
          <p class="success">{{ message() }}</p>
        }
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button class="btn" type="submit" [disabled]="loading()">
          {{ loading() ? 'Enviando...' : 'Enviar link' }}
        </button>
      </form>

      <p class="links"><a routerLink="/login">Voltar ao login</a></p>
    </div>
  </div>
</section>
