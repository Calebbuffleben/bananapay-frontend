<section class="auth-screen">
  <div class="auth-stage">
    <div class="brand-plane" aria-label="banana pay">
      <p class="brand-mark">
        <span class="banana">banana</span><span class="pay">pay</span>
        <small>Nova senha</small>
      </p>
      <h1>Defina uma senha forte.</h1>
      <p class="lede">Depois é só entrar e continuar de onde parou.</p>
    </div>

    <div class="auth-panel">
      <h2>Nova senha</h2>
      <p class="muted">Defina uma nova senha para sua conta</p>

      <form (ngSubmit)="submit()">
        <label class="field">
          Nova senha
          <input type="password" name="password" [(ngModel)]="password" required minlength="6" autocomplete="new-password" />
        </label>
        <label class="field">
          Confirmar senha
          <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6" autocomplete="new-password" />
        </label>

        @if (message()) {
          <p class="success">{{ message() }}</p>
        }
        @if (error()) {
          <p class="error">{{ error() }}</p>
        }

        <button class="btn" type="submit" [disabled]="loading() || !token">
          {{ loading() ? 'Salvando...' : 'Salvar senha' }}
        </button>
      </form>

      <p class="links"><a routerLink="/login">Voltar ao login</a></p>
    </div>
  </div>
</section>
